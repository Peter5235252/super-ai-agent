name: build-windows

on:
  push:
    branches: [main, tauri-shell]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Tauri icons if missing
        shell: pwsh
        run: |
          if ((Test-Path "src-tauri/icons") -and (Get-ChildItem "src-tauri/icons" | Where-Object { $_.Length -gt 0 })) {
            Write-Output "icons already present"
          } elseif (Test-Path "scripts/generate-icons.ps1") {
            pwsh scripts/generate-icons.ps1
          } else {
            New-Item -ItemType Directory -Path "src-tauri/icons" -Force | Out-Null
            $head = Invoke-WebRequest -Uri "https://picsum.photos/256" -UseBasicParsing -OutFile "src-tauri/icons/icon.png" -ErrorAction SilentlyContinue
            Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/icon.ico" -ErrorAction SilentlyContinue
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p app-ui

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: super-ai-windows
          path: target/release/super-ai-native.exe
          if-no-files-found: error
