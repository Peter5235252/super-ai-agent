name: CI

on:
  push:
    branches: [main, tauri-shell]
  pull_request:
    branches: [main, tauri-shell]
  workflow_dispatch:

jobs:
  check-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Tauri icons if missing
        shell: pwsh
        run: |
          if ((Test-Path "src-tauri/icons") -and (Get-ChildItem "src-tauri/icons" | Where-Object { $_.Length -gt 0 })) {
            Write-Output "icons already present"
          } elseif (Test-Path "scripts/generate-icons.ps1") {
            pwsh scripts/generate-icons.ps1
          } else {
            New-Item -ItemType Directory -Path "src-tauri/icons" -Force | Out-Null
            $head = Invoke-WebRequest -Uri "https://picsum.photos/256" -UseBasicParsing -OutFile "src-tauri/icons/icon.png" -ErrorAction SilentlyContinue
            Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/icon.ico" -ErrorAction SilentlyContinue
          }

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install + typecheck + build
        working-directory: frontend
        run: |
          npm install
          npm run build