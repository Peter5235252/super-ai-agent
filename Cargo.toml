[workspace]
resolver = "3"
members = [
    "crates/app-core",
    "crates/provider-api",
    "crates/provider-openai",
    "crates/provider-anthropic",
    "crates/provider-xai",
    "crates/provider-compat",
    "crates/tool-core",
    "crates/tool-filesystem",
    "crates/tool-process",
    "crates/policy-engine",
    "crates/agent-runtime",
    "crates/persistence",
    "crates/secrets",
    "crates/app-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Super-AI Contributors"]
license = "MIT"

[workspace.dependencies]
app-core = { path = "crates/app-core" }
provider-api = { path = "crates/provider-api" }
provider-openai = { path = "crates/provider-openai" }
provider-anthropic = { path = "crates/provider-anthropic" }
provider-xai = { path = "crates/provider-xai" }
provider-compat = { path = "crates/provider-compat" }
tool-core = { path = "crates/tool-core" }
tool-filesystem = { path = "crates/tool-filesystem" }
tool-process = { path = "crates/tool-process" }
policy-engine = { path = "crates/policy-engine" }
agent-runtime = { path = "crates/agent-runtime" }
persistence = { path = "crates/persistence" }
secrets = { path = "crates/secrets" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
lucide-icons = "1"
skrifa = "0.44"
secrecy = { version = "0.10", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"